
# ==========================================
# 1. HTTP - Truy cập bằng IP hoặc domain
# ==========================================
server {
    listen 80;
    listen [::]:80;

    server_name _;

    # Let's Encrypt xác thực domain
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Nếu truy cập bằng domain thì chuyển HTTPS
    location / {
        if ($host = novashop1.duckdns.org) {
            return 301 https://novashop1.duckdns.org$request_uri;
        }

        if ($host = www.novashop1.duckdns.org) {
            return 301 https://novashop1.duckdns.org$request_uri;
        }

        # Truy cập bằng IP: giữ HTTP
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API qua HTTP (dùng khi truy cập bằng IP)
    location /api/v1 {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}


# ==========================================
# 2. HTTPS - Chuyển www sang domain chính
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name www.novashop1.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/novashop1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novashop1.duckdns.org/privkey.pem;

    return 301 https://novashop1.duckdns.org$request_uri;
}


# ==========================================
# 3. HTTPS - Domain chính
# ==========================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name novashop1.duckdns.org;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/novashop1.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/novashop1.duckdns.org/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml;

    # General Settings
    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 10m;

    # Static File Caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff2|woff|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Reverse Proxy tới Spring Boot
    location /api/v1 {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Frontend React/Vue
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
