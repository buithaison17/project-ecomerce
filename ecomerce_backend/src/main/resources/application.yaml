spring:
  application:
    name: ecomerce_backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DATA_SOURCE_USERNAME}
    password: ${DATA_SOURCE_PASSSWORD}
    url: ${DATA_SOURCE_URL}
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  config:
    import:
      optional:file:.env[.properties]
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
app:
  low-stock-threshold: 5
  shipping-fee: ${SHIPPING_FEE:0}
  seed-sample-data: ${SEED_SAMPLE_DATA:true}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:ecommerce/products}
